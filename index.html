<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>WTC Cycle Timer v6.4</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#000;--green:#1b5e20;--red:#b71c1c;--grey:#505050;--btn-start:#00e676;--btn-finish:#ff1744;--btn-reset:#2979ff;--purple:#651fff;--orange:#ff9800;--yellow:#ffd600;--cyan:#00e5ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#fff;font-family:'Roboto Condensed','Arial Narrow',sans-serif;height:100vh;height:100dvh;overflow:hidden;width:100%;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation;-webkit-appearance:none;user-select:none}

/* 畫面1: 計時器 */
.screen-timer{width:100%;height:100%;position:absolute;top:0;left:0;z-index:10;overflow:hidden}
.header{position:absolute;top:0;left:0;width:100%;min-height:80px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,0));z-index:500;pointer-events:none}
.header>*{pointer-events:auto}
.header-left{display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
.header-row{display:flex;align-items:center;gap:8px}
.input-group{display:flex;align-items:center;gap:5px;color:#ccc;font-size:.9rem;font-weight:bold;background:rgba(60,60,60,.7);padding:5px 8px;border-radius:6px}
.label-text{font-size:.8rem;color:#bbb}
input[type=number]{background:#1e1e1e;border:1px solid #888;color:#fff;padding:8px 4px;border-radius:4px;font-size:20px;text-align:center;font-weight:bold}
.input-gear,.input-laps{width:60px}.input-dist{width:80px}

.btn-audio,.btn-icon-round{position:relative;width:40px;height:40px;display:flex;justify-content:center;align-items:center;font-size:1.2rem;cursor:pointer;margin-left:5px;border:1px solid #888;color:#fff}
.btn-audio{background:rgba(60,60,60,.7);color:#888;border-radius:6px;transition:all .2s}
.btn-audio.active{background:rgba(0,50,0,.9);color:var(--btn-start);border-color:var(--btn-start);box-shadow:0 0 8px rgba(0,230,118,.3)}
.btn-icon-round{border-radius:50%;background:rgba(40,40,40,.9);border-color:#999}
#historyBtn{color:var(--orange);border-color:var(--orange);border-radius:6px}
/* 擴大點擊範圍 */
.btn-audio::before,.btn-icon-round::before{content:'';position:absolute;width:60px;height:60px;top:50%;left:50%;transform:translate(-50%,-50%)}
.btn-audio>*,.btn-icon-round>*{pointer-events:none}

.btn-mini-reset{display:none;position:absolute;left:10px;top:max(10px,env(safe-area-inset-top));z-index:2000;justify-content:center;align-items:center;height:50px;min-width:90px;padding:0 15px;font-size:1.1rem;font-weight:bold;text-transform:uppercase;color:#fff;background:#d32f2f;border:1px solid #ff5252;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.6);cursor:pointer}
.btn-mini-reset:active{transform:scale(.95)}

.tap-area{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:background-color .15s}
.floating-action-container{position:absolute;bottom:20%;right:20px;width:100px;height:100px;z-index:100;display:flex;justify-content:center;align-items:center}
.action-btn{width:100px;height:100px;border-radius:50%;font-size:1.3rem;font-weight:900;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.6);transition:transform .1s;display:flex;justify-content:center;align-items:center;text-align:center;line-height:1.1;padding:10px;border:3px solid #fff}
.action-btn:active{transform:scale(.9)}
.btn-start{background:var(--btn-start);color:#000}
.btn-finish{background:var(--btn-finish);color:#fff}
.btn-reset-float{background:var(--btn-reset);color:#fff;font-size:1.2rem}

.info-corner{position:absolute;font-family:monospace;opacity:.7;z-index:5;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.top-left{top:150px;left:20px;line-height:1;display:flex;flex-direction:column;align-items:flex-start}
.lap-info-row{display:none}
#lapCounter{font-size:10vmin;font-weight:bold;line-height:.9}
#lapsRemaining{font-size:4vmin;color:var(--yellow);font-weight:bold;display:none;margin:5px 0}
.branding-text{font-size:10px;font-family:sans-serif;color:#888;font-style:italic;margin-top:5px;letter-spacing:1px}
.top-right{top:150px;right:20px;text-align:right}
#totalTimer{font-size:5vmin;display:block;font-weight:bold}
#runningLapTimer{font-size:4vmin;color:var(--cyan);display:block;margin-top:5px;font-weight:bold}
.coach-display{font-size:45vmin;font-weight:900;line-height:.9;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.05em;margin-top:-5vh;text-shadow:0 4px 10px rgba(0,0,0,.4);padding-right:10vw}
.sub-display-container{display:flex;flex-direction:column;align-items:center;padding-right:10vw}
.full-display{font-size:8vmin;font-family:monospace;opacity:.8;font-weight:bold}
.diff-display{font-size:6vmin;font-weight:bold;margin-top:1vh;padding:.5vmin 2vmin;border-radius:6px;background:rgba(0,0,0,.3);min-height:7vmin}
.waiting-text{font-size:8vmin;color:#888;font-weight:900;text-transform:uppercase;text-align:center;line-height:1.2;padding-right:10vw}
.countdown-number{font-size:50vmin;color:var(--yellow);font-weight:900;line-height:1;display:block;text-shadow:0 0 10px #000}
.alert-overlay{position:absolute;top:75%;transform:translateY(-50%);left:20px;pointer-events:none;z-index:25;display:none}
.alert-text{font-size:3.5vmin;font-weight:900;color:#fff;background:rgba(0,0,0,.85);padding:8px 12px;border-radius:8px;border:2px solid #fff}
.bg-faster{background-color:var(--green)!important}
.bg-slower{background-color:var(--red)!important}
.bg-stable{background-color:var(--grey)!important}

/* 畫面2: 摘要 */
.screen-summary{display:none;flex-direction:column;position:absolute;inset:0;background:#000;z-index:2000}
.summary-header-bar{flex:0 0 90px;padding:10px 15px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;background:#111;border-bottom:2px solid #333;z-index:3000}
.summary-info{display:flex;flex-direction:column}
.summary-label{font-size:.8rem;color:#888}
.summary-total{font-size:1.5rem;font-weight:bold;font-family:monospace}
.summary-sub{font-size:.9rem;color:#00bcd4;font-weight:bold;margin-top:2px}
.summary-header-right{display:flex;gap:10px;align-items:center;z-index:3001}
.btn-icon-sq{width:45px;height:45px;background:#333;border:1px solid #777;border-radius:8px;color:#fff;font-size:1.5rem;display:flex;justify-content:center;align-items:center;cursor:pointer}
.btn-icon-sq:active{background:#555}
.btn-header-share{background:var(--purple);border:1px solid #fff;padding:0 15px;height:45px;font-size:1rem;font-weight:900;text-transform:uppercase;color:#fff;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.5);cursor:pointer}
.btn-header-share:active{transform:scale(.95);background:#512da8}
.report-options-menu{position:absolute;top:80px;right:15px;background:#222;border:1px solid #555;border-radius:8px;padding:10px;z-index:4000;display:none;flex-direction:column;gap:8px;box-shadow:0 5px 20px rgba(0,0,0,.8);min-width:180px}
.report-options-menu.show{display:flex}
.report-option-item{display:flex;align-items:center;gap:10px;color:#eee;font-size:1rem;cursor:pointer}
.report-option-item input{transform:scale(1.3);margin:0}
.summary-content{flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding-bottom:30vh}
.summary-table{width:100%;border-collapse:collapse;font-size:4vmin}
.summary-table th{position:sticky;top:0;background:#222;color:#aaa;padding:10px;text-transform:uppercase;font-size:3vmin;z-index:15}
.summary-table td{padding:1.5vh 1vw;text-align:center;border-bottom:1px solid #222;font-family:monospace;font-weight:bold}
.row-faster{color:#69f0ae}.row-slower{color:#ff5252}.row-stable{color:#aaa}

/* 畫面3: 歷史 */
.screen-history{display:none;position:absolute;inset:0;background:#000;z-index:5000;flex-direction:column;padding-top:max(10px,env(safe-area-inset-top))}
.history-header{flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #333;background:#111}
.history-title{font-size:1.2rem;font-weight:bold;color:#aaa}
.history-actions{display:flex;gap:15px}
.btn-close-history{background:transparent;border:none;color:#fff;font-size:1.5rem;cursor:pointer;padding:10px}
.btn-hist-mini{padding:6px 12px;border-radius:4px;font-weight:bold;font-size:.85rem;cursor:pointer;border:none;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.btn-hist-mini:active{transform:scale(.95)}
.btn-dl-all{background:var(--green);color:#fff}
.btn-clear-all{background:#ff4444;color:#fff}
.history-list{flex:1;overflow-y:auto;padding:10px 10px 50px;-webkit-overflow-scrolling:touch}
.history-item{background:#222;padding:15px;margin-bottom:10px;border-radius:8px;border:1px solid #444;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.history-item:active{background:#333}
.hist-info{display:flex;flex-direction:column;gap:4px}
.hist-date{font-size:.9rem;color:#aaa}
.hist-main{font-size:1.2rem;font-weight:bold}
.hist-meta{font-size:.9rem;color:#00bcd4}
.toast{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#000;padding:12px 24px;border-radius:50px;font-weight:bold;display:none;z-index:9999;width:max-content;max-width:80%;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.6);font-size:1.2rem}
</style>
</head>
<body>
<!-- 畫面1: 計時器 -->
<div id="screenTimer" class="screen-timer">
  <div id="mainHeader" class="header">
    <div class="header-left">
      <div class="header-row">
        <div class="input-group">
          <span class="label-text">GEAR</span>
          <input type="number" id="gearFront" class="input-gear" placeholder="F" inputmode="numeric">
          <span style="color:#888">x</span>
          <input type="number" id="gearRear" class="input-gear" placeholder="R" inputmode="numeric">
        </div>
        <div class="input-group">
          <span class="label-text">DIST</span>
          <input type="number" id="distInput" class="input-dist" placeholder="m" inputmode="numeric">
          <span style="font-size:.7rem">m</span>
        </div>
      </div>
      <div class="header-row">
        <div class="input-group">
          <span class="label-text">LAPS</span>
          <input type="number" id="totalLapsInput" class="input-laps" inputmode="numeric">
        </div>
        <button id="audioBtn" class="btn-audio">🎵</button>
        <button id="historyBtn" class="btn-icon-round">📜</button>
        <button id="fullscreenBtn" class="btn-icon-round">⛶</button>
      </div>
    </div>
  </div>

  <button id="topResetBtn" class="btn-mini-reset">Reset</button>

  <div id="tapArea" class="tap-area">
    <div class="info-corner top-left">
      <div class="lap-info-row" id="lapInfoRow"><div id="lapCounter">0</div></div>
      <div id="lapsRemaining"></div>
      <div class="branding-text">by Woody Wong v6.4</div>
    </div>
    <div class="info-corner top-right">
      <div id="totalTimer">00:00.000</div>
      <div id="runningLapTimer">00:00.000</div>
    </div>
    <div id="alertOverlay" class="alert-overlay"><div id="alertText" class="alert-text"></div></div>
    <div id="waitingText" class="waiting-text">TAP ANYWHERE<br>TO START</div>
    <div id="activeDisplay" style="display:none;width:100%">
      <div id="coachDisplay" class="coach-display">0.0</div>
      <div class="sub-display-container">
        <div id="fullDisplay" class="full-display">0.000</div>
        <div id="diffDisplay" class="diff-display"></div>
      </div>
    </div>
  </div>
  <div class="floating-action-container"><button id="mainBtn" class="action-btn btn-start">START</button></div>
</div>

<!-- 畫面2: 摘要 -->
<div id="screenSummary" class="screen-summary">
  <div class="summary-header-bar">
    <div class="summary-info">
      <span class="summary-label">TOTAL TIME</span>
      <span id="finalTotalTime" class="summary-total">00:00.000</span>
      <span id="summaryGearInfo" class="summary-sub"></span>
    </div>
    <div class="summary-header-right">
      <button id="csvBtn" class="btn-icon-sq" title="Download CSV">💾</button>
      <button id="settingsBtn" class="btn-icon-sq">⚙️</button>
      <button id="shareBtn" class="btn-header-share">SHARE</button>
    </div>
  </div>
  <div id="reportMenu" class="report-options-menu">
    <div style="color:#aaa;font-size:.8rem;margin-bottom:5px;font-weight:bold">REPORT OPTIONS</div>
    <div style="background:#333;padding:5px;border-radius:5px;margin-bottom:5px">
      <label class="report-option-item" style="font-weight:bold;color:#25D366"><input type="checkbox" id="optWhatsApp"> WhatsApp Format</label>
    </div>
    <label class="report-option-item"><input type="checkbox" id="optDate" checked> Date</label>
    <label class="report-option-item"><input type="checkbox" id="optStartTime" checked> Start Time</label>
    <label class="report-option-item"><input type="checkbox" id="optTotal" checked> Total Time</label>
    <label class="report-option-item"><input type="checkbox" id="optGear" checked> Gear</label>
    <label class="report-option-item"><input type="checkbox" id="optDist" checked> Distance</label>
    <label class="report-option-item"><input type="checkbox" id="optLaps" checked> Total Laps</label>
    <div style="border-top:1px solid #444;margin:5px 0"></div>
    <label class="report-option-item"><input type="checkbox" id="optTable" checked> Lap Data (List)</label>
    <label class="report-option-item"><input type="checkbox" id="optAudioToggle" checked> Audio Start</label>
  </div>
  <div class="summary-content">
    <table class="summary-table" id="summaryTable">
      <thead><tr><th width="15%">Lap</th><th width="35%">Total</th><th width="30%">Split</th><th width="20%">Diff</th></tr></thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>
  <div class="floating-action-container"><button id="nextSessionBtn" class="action-btn btn-reset-float">NEXT<br>SESSION</button></div>
</div>

<!-- 畫面3: 歷史 -->
<div id="screenHistory" class="screen-history">
  <div class="history-header">
    <span class="history-title">HISTORY</span>
    <div class="history-actions">
      <button id="dlAllCsvBtn" class="btn-hist-mini btn-dl-all">📥 ALL CSV</button>
      <button id="clearAllBtn" class="btn-hist-mini btn-clear-all">🗑️ CLEAR ALL</button>
    </div>
    <button id="closeHistoryBtn" class="btn-close-history">✕</button>
  </div>
  <div id="historyList" class="history-list"></div>
</div>

<div id="toast" class="toast"></div>

<script>
// ================= 常數 =================
const MIN_LAP_MS = 2000;      // 最短圈速保護（防雙擊）
const STABLE_THRESHOLD = 0.15; // 圈速差 ±秒 內視為穩定
const EDGE_MARGIN = 40;       // 邊緣死區 px

// ================= 狀態 =================
let startTime = 0, lastLapTime = 0, lapCount = 0;
let isRunning = false, isCountingDown = false;
let laps = [], sessionDate = null, sessionHistory = [];
let alertTimeout, countdownTimeouts = [], activeOscs = [], wakeLock = null;
let reportOptions = {
  date:false, startTime:false, total:true, gear:false, dist:false,
  laps:false, table:true, audioStart:false, whatsAppFormat:false
};

// ================= DOM =================
const $ = id => document.getElementById(id);
const screenTimer=$('screenTimer'), screenSummary=$('screenSummary'), screenHistory=$('screenHistory');
const mainBtn=$('mainBtn'), topResetBtn=$('topResetBtn'), tapArea=$('tapArea');
const audioBtn=$('audioBtn'), settingsBtn=$('settingsBtn'), reportMenu=$('reportMenu');
const summaryTable=$('summaryTable'), waitingTextEl=$('waitingText');
const historyBtn=$('historyBtn'), closeHistoryBtn=$('closeHistoryBtn'), historyListEl=$('historyList');
const csvBtn=$('csvBtn'), dlAllCsvBtn=$('dlAllCsvBtn'), clearAllBtn=$('clearAllBtn');
const totalLapsInput=$('totalLapsInput'), gearFrontInput=$('gearFront'), gearRearInput=$('gearRear'), distInput=$('distInput');
const optDate=$('optDate'), optStartTime=$('optStartTime'), optTotal=$('optTotal'), optGear=$('optGear'),
      optDist=$('optDist'), optLaps=$('optLaps'), optTable=$('optTable'), optAudioToggle=$('optAudioToggle'),
      optWhatsApp=$('optWhatsApp');
const lapCounterEl=$('lapCounter'), lapsRemainingEl=$('lapsRemaining'), lapInfoRow=$('lapInfoRow');
const totalTimerEl=$('totalTimer'), runningLapTimerEl=$('runningLapTimer');
const activeDisplayEl=$('activeDisplay'), coachDisplayEl=$('coachDisplay'), fullDisplayEl=$('fullDisplay'), diffDisplayEl=$('diffDisplay');
const alertOverlay=$('alertOverlay'), alertText=$('alertText');
const summaryBody=$('summaryBody'), finalTotalTimeEl=$('finalTotalTime'), summaryGearInfo=$('summaryGearInfo');
const nextSessionBtn=$('nextSessionBtn'), shareBtn=$('shareBtn'), toast=$('toast'), headerLeft=document.querySelector('.header-left');

// ================= 儲存 =================
function safeSet(k, v) {
  try { localStorage.setItem(k, v); } catch (e) { showToast('儲存失敗'); }
}
function safeGet(k) {
  try { return localStorage.getItem(k); } catch (e) { return null; }
}

function loadSettings() {
  try { reportOptions = { ...reportOptions, ...JSON.parse(safeGet('wtc_report_options_v4') || '{}') }; } catch (e) {}
  optDate.checked = reportOptions.date;
  optStartTime.checked = reportOptions.startTime;
  optTotal.checked = reportOptions.total;
  optGear.checked = reportOptions.gear;
  optDist.checked = reportOptions.dist;
  optLaps.checked = reportOptions.laps;
  optTable.checked = reportOptions.table;
  optAudioToggle.checked = reportOptions.audioStart;
  optWhatsApp.checked = reportOptions.whatsAppFormat;
  try { sessionHistory = JSON.parse(safeGet('wtc_session_history')) || []; } catch (e) { sessionHistory = []; }
}

function saveSettings() {
  reportOptions = {
    date:optDate.checked, startTime:optStartTime.checked, total:optTotal.checked,
    gear:optGear.checked, dist:optDist.checked, laps:optLaps.checked, table:optTable.checked,
    audioStart:optAudioToggle.checked, whatsAppFormat:optWhatsApp.checked
  };
  safeSet('wtc_report_options_v4', JSON.stringify(reportOptions));
  summaryTable.style.display = reportOptions.table ? 'table' : 'none';
  updateAudioBtnState();
}
[optDate,optStartTime,optTotal,optGear,optDist,optLaps,optTable,optAudioToggle,optWhatsApp]
  .forEach(el => el.addEventListener('change', saveSettings));

// ================= 工具 =================
function formatTime(ms) {
  const d = new Date(ms);
  return `${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')}.${String(d.getUTCMilliseconds()).padStart(3,'0')}`;
}
function formatCoachStyle(ms) {
  const s = ms / 1000;
  return `${Math.floor(s) % 10}.${Math.floor((s * 10) % 10)}`;
}
function fmtDiff(lap) {
  if (lap.lapNum === 1) return '-';
  const v = (lap.diff / 1000).toFixed(2);
  return lap.diff > 0 ? '+' + v : v;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function getFormattedDate(d) {
  d = d || new Date();
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)}`;
}
function getFormattedTime(d) {
  d = d || new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
function getGearString() {
  const f = gearFrontInput.value, r = gearRearInput.value;
  return (f && r) ? `${f}x${r}` : '';
}
function getTotalTimeDisplay() {
  return formatTime(laps.length ? laps[laps.length - 1].totalTime : 0);
}
function showAlert(msg, color) {
  alertText.textContent = msg;
  alertText.style.color = color || '#fff';
  alertText.style.borderColor = color || '#fff';
  alertOverlay.style.display = 'block';
  clearTimeout(alertTimeout);
  alertTimeout = setTimeout(() => { alertOverlay.style.display = 'none'; }, 2500);
}
function showToast(msg) {
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

// 只綁 click（有 user activation，Share / 下載 / 剪貼簿先穩定）
const bindClick = (el, handler) => {
  if (!el) return;
  el.addEventListener('click', e => { e.stopPropagation(); handler(); });
};

// ================= 音效 =================
function getAudioCtx() {
  if (!window.sharedAudioCtx)
    window.sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return window.sharedAudioCtx;
}
// iOS：喺 touchend / click 解鎖
['touchend', 'click'].forEach(t =>
  document.addEventListener(t, () => {
    try { const c = getAudioCtx(); if (c.state === 'suspended') c.resume(); } catch (e) {}
  }, { passive: true }));

// 用 Audio 時鐘排程，唔受主線程影響
function scheduleBeep(when, isFinal) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator(), g = ctx.createGain();
  const dur = isFinal ? 0.8 : 0.4;
  osc.type = 'square';
  osc.frequency.value = isFinal ? 990 : 490;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(0.5, when + 0.01);
  g.gain.setValueAtTime(0.5, when + dur - 0.01);
  g.gain.linearRampToValueAtTime(0, when + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(when); osc.stop(when + dur);
  osc.onended = () => { osc.disconnect(); g.disconnect(); };
  activeOscs.push(osc);
}

function updateAudioBtnState() {
  if (optAudioToggle.checked) {
    audioBtn.classList.add('active');
    if (!isRunning && !isCountingDown) waitingTextEl.innerHTML = 'AUDIO READY<br>TAP TO START';
  } else {
    audioBtn.classList.remove('active');
    if (!isRunning && !isCountingDown) waitingTextEl.innerHTML = 'TAP ANYWHERE<br>TO START';
  }
}
bindClick(audioBtn, () => {
  optAudioToggle.checked = !optAudioToggle.checked;
  try { getAudioCtx().resume(); } catch (e) {}
  saveSettings();
});

// ================= Wake Lock =================
async function lockScreen() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
}
function unlockScreen() {
  try { wakeLock?.release(); } catch (e) {}
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (isRunning || isCountingDown)) lockScreen();
});

// ================= 計時核心 =================
function updateTimerUI() {
  if (!isRunning) return;
  const now = performance.now();
  totalTimerEl.textContent = formatTime(now - startTime);
  runningLapTimerEl.textContent = formatTime(now - lastLapTime);
  requestAnimationFrame(updateTimerUI);
}

function updateLapsRemaining() {
  const total = parseInt(totalLapsInput.value) || 0;
  const remaining = total - lapCount;
  if (total > 0 && remaining >= 0) {
    lapsRemainingEl.textContent = `(${remaining})`;
    lapsRemainingEl.style.display = 'block';
  } else lapsRemainingEl.style.display = 'none';
}

function hideHeader() {
  headerLeft.style.opacity = '0';
  headerLeft.style.pointerEvents = 'none';
}

function triggerStart() {
  if (isCountingDown || isRunning) return;
  lockScreen();

  if (!optAudioToggle.checked) { startSession(); return; }

  isCountingDown = true;
  waitingTextEl.innerHTML = '';
  hideHeader();
  tapArea.style.pointerEvents = 'none';
  mainBtn.style.pointerEvents = 'none';
  topResetBtn.style.display = 'flex';

  const ctx = getAudioCtx();
  ctx.resume();
  const t0 = ctx.currentTime + 0.3;                         // 第一下嘟聲
  const lat = ctx.outputLatency || ctx.baseLatency || 0;    // 輸出延遲補償（視覺對齊聲音）
  for (let i = 5; i >= 0; i--) {
    const when = t0 + (5 - i);
    scheduleBeep(when, i === 0);
    const ms = Math.max(0, (when - ctx.currentTime + lat) * 1000);
    countdownTimeouts.push(setTimeout(() => {
      if (!isCountingDown) return;
      if (i > 0) {
        waitingTextEl.innerHTML = `<span class="countdown-number">${i}</span>`;
      } else {
        isCountingDown = false;
        tapArea.style.pointerEvents = 'auto';
        mainBtn.style.pointerEvents = 'auto';
        startSession();
      }
    }, ms));
  }
}

function startSession() {
  if (isRunning) return;
  isRunning = true;
  startTime = performance.now();
  sessionDate = new Date();
  lastLapTime = startTime;
  lapCount = 0;
  laps = [];

  mainBtn.textContent = 'FINISH';
  mainBtn.className = 'action-btn btn-finish';
  hideHeader();
  topResetBtn.style.display = 'flex';
  waitingTextEl.style.display = 'none';
  waitingTextEl.innerHTML = '';
  activeDisplayEl.style.display = 'block';
  alertOverlay.style.display = 'none';
  coachDisplayEl.textContent = '0.0';
  fullDisplayEl.textContent = '0.000';
  diffDisplayEl.textContent = '';
  lapCounterEl.textContent = '0';
  lapInfoRow.style.display = 'flex';
  updateLapsRemaining();
  runningLapTimerEl.textContent = '00:00.000';
  tapArea.className = 'tap-area bg-stable';
  updateTimerUI();
}

function lap() {
  if (!isRunning) return;
  const now = performance.now();
  if (now - lastLapTime < MIN_LAP_MS) return; // 防雙擊
  const lapDuration = now - lastLapTime;
  const totalDuration = now - startTime;
  lastLapTime = now;
  lapCount++;

  let diff = 0, colorClass = 'bg-stable';
  if (laps.length > 0) {
    diff = lapDuration - laps[laps.length - 1].splitTime;
    if (Math.abs(diff / 1000) <= STABLE_THRESHOLD) colorClass = 'bg-stable';
    else colorClass = diff < 0 ? 'bg-faster' : 'bg-slower';
  }
  laps.push({ lapNum: lapCount, splitTime: lapDuration, totalTime: totalDuration, diff, status: colorClass });

  lapCounterEl.textContent = lapCount;
  updateLapsRemaining();
  coachDisplayEl.textContent = formatCoachStyle(lapDuration);
  fullDisplayEl.textContent = (lapDuration / 1000).toFixed(3);
  diffDisplayEl.textContent = lapCount > 1 ? `${diff > 0 ? '+' : ''}${(diff / 1000).toFixed(2)}s` : 'Start';
  tapArea.className = `tap-area ${colorClass}`;

  const totalLaps = parseInt(totalLapsInput.value);
  if (totalLaps > 0) {
    const r = totalLaps - lapCount;
    if (r === 10) showAlert('10 LAPS LEFT', '#ffd600');
    else if (r === 5) showAlert('5 LAPS LEFT', '#ff6d00');
    else if (r === 1) showAlert('LAST LAP', '#ff1744');
    else if (r === 0) showAlert('FINISHED', '#ff1744');
  }
}

// ================= 結束 / 重設 =================
function saveCurrentSession() {
  if (laps.length === 0) return;
  sessionHistory.unshift({
    id: Date.now(),
    date: sessionDate,
    laps: [...laps],
    gearF: gearFrontInput.value,
    gearR: gearRearInput.value,
    dist: distInput.value,
    totalTimeRaw: laps[laps.length - 1].totalTime
  });
  if (sessionHistory.length > 200) sessionHistory.pop();
  safeSet('wtc_session_history', JSON.stringify(sessionHistory));
}

function renderSummaryData() {
  finalTotalTimeEl.textContent = getTotalTimeDisplay();
  const gear = getGearString();
  summaryGearInfo.textContent = gear ? `Gear: ${gear}` : '';
  summaryBody.innerHTML = '';
  laps.forEach(l => {
    let cls = 'row-stable';
    if (l.status === 'bg-faster') cls = 'row-faster';
    if (l.status === 'bg-slower') cls = 'row-slower';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${l.lapNum}</td><td>${formatTime(l.totalTime)}</td><td class="${cls}" style="font-size:3.5vmin">${(l.splitTime/1000).toFixed(3)}</td><td class="${cls}">${fmtDiff(l)}</td>`;
    summaryBody.appendChild(tr);
  });
}

// 方案 A：FINISH 只結束，不自動補計最後一圈
function finishSession(viewOnly = false) {
  if (!viewOnly) {
    if (!isRunning) return;
    isRunning = false;
    saveCurrentSession();
    unlockScreen();
  }
  screenTimer.style.display = 'none';
  screenSummary.style.display = 'flex';
  renderSummaryData();
}

function resetAll() {
  isCountingDown = false;
  isRunning = false;
  tapArea.style.pointerEvents = 'auto';
  mainBtn.style.pointerEvents = 'auto';
  startTime = 0; laps = []; lapCount = 0;
  alertOverlay.style.display = 'none';

  countdownTimeouts.forEach(clearTimeout);
  countdownTimeouts = [];
  activeOscs.forEach(o => { try { o.stop(); } catch (e) {} });
  activeOscs = [];
  unlockScreen();

  screenSummary.style.display = 'none';
  screenTimer.style.display = 'flex';
  mainBtn.textContent = 'START';
  mainBtn.className = 'action-btn btn-start';
  headerLeft.style.opacity = '1';
  headerLeft.style.pointerEvents = 'auto';
  topResetBtn.style.display = 'none';
  tapArea.className = 'tap-area';
  activeDisplayEl.style.display = 'none';
  waitingTextEl.style.display = 'block';
  updateAudioBtnState();

  totalTimerEl.textContent = '00:00.000';
  runningLapTimerEl.textContent = '00:00.000';
  lapCounterEl.textContent = '0';
  lapInfoRow.style.display = 'none';
  lapsRemainingEl.style.display = 'none';
}

// ================= 歷史 =================
function renderHistoryList() {
  historyListEl.innerHTML = '';
  if (sessionHistory.length === 0) {
    historyListEl.innerHTML = "<div style='color:#666;text-align:center;padding:20px'>No history recorded</div>";
    return;
  }
  sessionHistory.forEach(s => {
    const d = new Date(s.date);
    const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${d.getHours()}:${pad2(d.getMinutes())}`;
    const total = formatTime(s.totalTimeRaw || (s.laps.length ? s.laps[s.laps.length-1].totalTime : 0));
    const gear = (s.gearF && s.gearR) ? `${s.gearF}x${s.gearR}` : '';
    const dist = s.dist ? `${s.dist}m` : '';
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `<div class="hist-info"><span class="hist-date">${dateStr}</span><span class="hist-meta">${s.laps.length} Laps${gear ? ' | ' + gear : ''}${dist ? ' | ' + dist : ''}</span></div><span class="hist-main">${total}</span>`;
    div.onclick = () => loadSessionFromHistory(s);
    historyListEl.appendChild(div);
  });
}

function loadSessionFromHistory(s) {
  laps = s.laps;
  sessionDate = new Date(s.date);
  gearFrontInput.value = s.gearF || '';
  gearRearInput.value = s.gearR || '';
  distInput.value = s.dist || '';
  screenHistory.style.display = 'none';
  finishSession(true);
}

function clearAllHistory() {
  if (!confirm('⚠️ 確定要刪除所有歷史紀錄嗎？此動作無法還原。')) return;
  sessionHistory = [];
  try { localStorage.removeItem('wtc_session_history'); } catch (e) {}
  renderHistoryList();
  showToast('歷史紀錄已清空');
}

// ================= CSV =================
function downloadCSV(content, filename) {
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// 欄位次序統一：Lap,Total,Split,Diff
function lapsToCSV(list) {
  let out = 'Lap,Total,Split,Diff\n';
  list.forEach(l => {
    out += `${l.lapNum},${formatTime(l.totalTime)},${(l.splitTime/1000).toFixed(3)},${(l.diff/1000).toFixed(2)}\n`;
  });
  return out;
}

function exportToCSV() {
  let csv = '\uFEFF';
  csv += `Date,${getFormattedDate(sessionDate)} ${getFormattedTime(sessionDate)}\n`;
  const gear = getGearString();
  if (gear) csv += `Gear,${gear}\n`;
  if (distInput.value) csv += `Distance,${distInput.value}m\n`;
  csv += `Total Time,${getTotalTimeDisplay()}\n\n`;
  csv += lapsToCSV(laps);
  downloadCSV(csv, `cycle_timer_${Date.now()}.csv`);
}

function exportAllHistoryToCSV() {
  if (sessionHistory.length === 0) { alert('No history to download.'); return; }
  let csv = '\uFEFF';
  sessionHistory.forEach((s, i) => {
    const d = new Date(s.date);
    csv += `SESSION ${i + 1}\n`;
    csv += `Date,${getFormattedDate(d)}\n`;
    csv += `Time,${pad2(d.getHours())}:${pad2(d.getMinutes())}\n`;
    csv += `Gear,${(s.gearF && s.gearR) ? s.gearF + 'x' + s.gearR : 'N/A'}\n`;
    csv += `Dist,${s.dist ? s.dist + 'm' : 'N/A'}\n`;
    csv += `Total,${formatTime(s.totalTimeRaw)}\n`;
    csv += lapsToCSV(s.laps) + '\n\n';
  });
  downloadCSV(csv, `WTC_Full_History_${Date.now()}.csv`);
}

// ================= 分享 =================
function generateShareText() {
  const dateStr = getFormattedDate(sessionDate), timeStr = getFormattedTime(sessionDate);
  const gear = getGearString();
  let text = '';
  if (reportOptions.whatsAppFormat) {
    if (reportOptions.dist || reportOptions.gear) {
      text += `🚴 *WTC Cycle Stats*\n`;
      if (reportOptions.dist && distInput.value) text += `📏 ${distInput.value}m `;
      if (reportOptions.gear && gear) text += `⚙️ ${gear}`;
      text += `\n\n`;
    }
    if (reportOptions.date) text += `📅 ${dateStr} ${timeStr}\n`;
    if (reportOptions.total) text += `⏱️ *Total: ${getTotalTimeDisplay()}*\n`;
    if (reportOptions.laps) text += `🔄 Laps: ${laps.length}\n`;
    if (reportOptions.table && laps.length) {
      text += `\n`;
      laps.forEach(l => { text += `L${l.lapNum}: *${(l.splitTime/1000).toFixed(3)}* (${fmtDiff(l)})\n`; });
    }
  } else {
    const head = [];
    if (reportOptions.dist && distInput.value) head.push(`${distInput.value}m`);
    if (reportOptions.gear && gear) head.push(gear);
    if (head.length) text += head.join(' | ') + '\n';
    if (reportOptions.date) text += `Date: ${dateStr}\n`;
    if (reportOptions.startTime) text += `Time: ${timeStr}\n`;
    if (reportOptions.total) text += `Total: ${getTotalTimeDisplay()}\n`;
    if (reportOptions.laps) text += `Laps: ${laps.length}\n`;
    if (reportOptions.table && laps.length) {
      text += `----------------------\nLap | Time | Split | Diff\n`;
      laps.forEach(l => {
        text += [String(l.lapNum).padEnd(3), formatTime(l.totalTime), (l.splitTime/1000).toFixed(3).padEnd(8), fmtDiff(l)].join(' | ') + '\n';
      });
    }
  }
  return text;
}

function copyToClipboard(text) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Data Copied!')).catch(() => textAreaCopy(text));
  } else textAreaCopy(text);
}
function textAreaCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('Copy'); showToast('Data Copied!'); }
  catch (e) { alert('Copy failed. Please copy manually:\n\n' + text); }
  document.body.removeChild(ta);
}

// ================= 事件 =================
function isEdgeTap(e) {
  const p = (e.touches && e.touches[0]) || e;
  if (p.clientX === undefined) return false; // 鍵盤事件
  return p.clientX < EDGE_MARGIN || p.clientX > innerWidth - EDGE_MARGIN ||
         p.clientY < EDGE_MARGIN || p.clientY > innerHeight - EDGE_MARGIN;
}

function handleTap(e) {
  if (e.target && e.target.closest && (
    e.target.closest('.floating-action-container') ||
    e.target.closest('.header') ||
    e.target.closest('.screen-summary') ||
    e.target.closest('.screen-history') ||
    e.target.tagName === 'INPUT' ||
    e.target.id === 'topResetBtn'
  )) return;
  if (isEdgeTap(e)) return;
  if (e.type === 'touchstart') e.preventDefault();
  if (!isRunning) triggerStart(); else lap();
}
// 計圈保留 touchstart（最低延遲）
tapArea.addEventListener('touchstart', handleTap, { passive: false });
tapArea.addEventListener('mousedown', handleTap);

document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat) return;
  if (e.target.tagName === 'INPUT') return;
  if (screenTimer.style.display === 'none' || screenHistory.style.display === 'flex') return;
  e.preventDefault();
  handleTap({ target: document.body, type: 'keydown', preventDefault() {} });
});

mainBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!isRunning) triggerStart(); else finishSession();
});

bindClick(topResetBtn, () => {
  if (isRunning && laps.length > 0 && !confirm('Session 未儲存，確定重設？')) return;
  resetAll();
});
bindClick(nextSessionBtn, resetAll);
bindClick(csvBtn, exportToCSV);
bindClick(dlAllCsvBtn, exportAllHistoryToCSV);
bindClick(clearAllBtn, clearAllHistory);
bindClick(historyBtn, () => { renderHistoryList(); screenHistory.style.display = 'flex'; });
bindClick(closeHistoryBtn, () => { screenHistory.style.display = 'none'; });
bindClick(settingsBtn, () => reportMenu.classList.toggle('show'));
bindClick(shareBtn, async () => {
  const text = generateShareText();
  try {
    if (navigator.share) await navigator.share({ text });
    else throw new Error('no share');
  } catch (err) {
    if (err && err.name === 'AbortError') return; // 用戶取消分享
    copyToClipboard(text);
  }
});
document.addEventListener('click', e => {
  if (!reportMenu.contains(e.target) && !settingsBtn.contains(e.target)) reportMenu.classList.remove('show');
});

// 全螢幕
$('fullscreenBtn').addEventListener('click', e => {
  e.preventDefault();
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(showFallbackAlert);
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else showFallbackAlert();
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
});
function showFallbackAlert() {
  alert('iPhone 或部分設備不支援直接全螢幕 🥲\n\n請撳瀏覽器「分享」掣 → 「加入主畫面 (Add to Home Screen)」，之後由桌面開啟就係全螢幕。');
}

// ================= 初始化 =================
loadSettings();
summaryTable.style.display = reportOptions.table ? 'table' : 'none';
updateAudioBtnState();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
}
</script>
